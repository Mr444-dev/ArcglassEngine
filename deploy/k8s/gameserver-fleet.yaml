apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engine-server-hpa
  namespace: game-servers
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engine-dedicated-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
